[project]
name = "tomo-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi~=0.128.0",
  "mangum~=0.19.0",
  "psycopg[binary]~=3.2",
  "uvicorn[standard]~=0.40.0",
]

[dependency-groups]
dev = [
  "httpx~=0.28",
  "pyrefly>=1.3.2",
  "pytest~=8.4",
  "ruff~=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
