name: Deploy CI
on:
  push:
    branches: [main]

jobs:
  ci-backend:
    uses: ./.github/workflows/ci-backend.yml
  ci-frontend:
    uses: ./.github/workflows/ci-frontend.yml

  push-images:
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for pushing to ghcr
    strategy:
      matrix:
        service: [backend, frontend]  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}  # https://github.com/docker/build-push-action#usage
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}${{ github.sha }}

