name: Backend CI
on: [pull_request, workflow_call]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tomo
          POSTGRES_PASSWORD: tomo
          POSTGRES_DB: tomo
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://tomo:tomo@localhost:5432/tomo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: latest
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check linting
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check types
        run: uv run pyrefly check
      - name: Run tests
        run: uv run pytest
